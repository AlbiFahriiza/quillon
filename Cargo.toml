[workspace]
resolver = "3"
members = ["crates/*"]

# Release targets (research/L; consumed by .github/workflows/release.yml
# and installer.sh). cargo-dist-compatible naming.
[workspace.metadata.dist]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlbiFahriiza/quillon"
rust-version = "1.85"

[workspace.dependencies]
rsubs-lib = "0.4.0"
ureq = "3.5.2"
whisper-rs = "0.16.0"
quillon-core = { path = "crates/quillon-core", version = "1.0.0-beta.1" }
quillon-render = { path = "crates/quillon-render", version = "1.0.0-beta.1" }
quillon-media = { path = "crates/quillon-media", version = "1.0.0-beta.1" }
quillon-cache = { path = "crates/quillon-cache", version = "1.0.0-beta.1" }
quillon-audio = { path = "crates/quillon-audio", version = "1.0.0-beta.1" }

# Versions verified against the crates.io API on 2026-11-18 (plan §16.4).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
jsonschema = "0.61.2"
clap = { version = "4.6.8", features = ["derive"] }
tiny-skia = "0.12.0"
cosmic-text = "0.19.0"
image = "0.25.10"
ffmpeg-sidecar = "2.7.0"
thiserror = "2.0.21"
rayon = "1.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
notify = "8.2.2"
anyhow = "1.0.104"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", features = ["mp3", "flac", "isomp4", "aac"] }
rubato = "5.1.0"
ebur128 = "0.1.11"
# MCP SDK (official, modelcontextprotocol org) — verified against the
# crates.io API on 2026-11-19; stdio server only (research/I §2).
rmcp = { version = "3.11", features = ["server", "transport-io"] }
# PNG frames travel as base64 inside MCP image content blocks.
base64 = "0.23.1"

# Debug builds without debuginfo: keeps target/ small on constrained disks
# (5.9 GB vs ~1.5 GB measured with full debuginfo) and speeds CI.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
