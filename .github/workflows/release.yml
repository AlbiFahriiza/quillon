# Release pipeline (cargo-dist pattern, hand-written per design note
# v1.0-beta D): five targets from research/L, checksummed artifacts,
# one GitHub Release per tag v*. The binaries render MP4 through the
# system ffmpeg at runtime — ffmpeg is NOT bundled (LGPL hygiene,
# research/P); the installer prints how to get it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds pin ubuntu-22.04 (glibc 2.35) so the binaries
          # run on older distributions; ubuntu-latest (glibc 2.43)
          # breaks every older glibc host.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          # The runner image is part of the key: a cache saved on
          # ubuntu-latest (glibc 2.43) poisons a ubuntu-22.04 job with
          # objects that reference __isoc23_* symbols its glibc does
          # not have.
          key: ${{ matrix.os }}-${{ matrix.target }}
      - name: Install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release -p quillon-cli --bin quillon --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          staging=quillon-${{ matrix.target }}
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/quillon" "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE "$staging/"
          tar -czf "quillon-${{ matrix.target }}.tar.gz" "$staging"
          sha256sum "quillon-${{ matrix.target }}.tar.gz" > "quillon-${{ matrix.target }}.tar.gz.sha256"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "quillon-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/quillon.exe" $staging/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE $staging/
          Compress-Archive -DestinationPath "quillon-${{ matrix.target }}.zip" -Path $staging
          $hash = (Get-FileHash "quillon-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  quillon-${{ matrix.target }}.zip" | Out-File -Encoding ascii "quillon-${{ matrix.target }}.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quillon-${{ matrix.target }}
          path: |
            quillon-${{ matrix.target }}.${{ matrix.archive }}
            quillon-${{ matrix.target }}.${{ matrix.archive }}.sha256

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          # Every .sha256 file verifies against its archive; a failed
          # platform blocks the release instead of shipping broken bits.
          sha256sum -c *.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Quillon $TAG" \
            --generate-notes \
            --prerelease \
            dist/*
      - name: Attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" installer.sh --clobber
