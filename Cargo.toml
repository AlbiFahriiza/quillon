[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlbiFahriiza/quillon"
rust-version = "1.85"

[workspace.dependencies]
quillon-core = { path = "crates/quillon-core", version = "0.1.0" }
quillon-render = { path = "crates/quillon-render", version = "0.1.0" }
quillon-media = { path = "crates/quillon-media", version = "0.1.0" }
quillon-cache = { path = "crates/quillon-cache", version = "0.1.0" }

# Versions verified against the crates.io API on 2026-11-18 (plan §16.4).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
jsonschema = "0.61.2"
clap = { version = "4.6.8", features = ["derive"] }
tiny-skia = "0.12.0"
cosmic-text = "0.19.0"
image = "0.25.10"
ffmpeg-sidecar = "2.7.0"
thiserror = "2.0.21"
rayon = "1.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
notify = "8.2.2"
anyhow = "1.0.104"
sha2 = "0.11.1"

# Debug builds without debuginfo: keeps target/ small on constrained disks
# (5.9 GB vs ~1.5 GB measured with full debuginfo) and speeds CI.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
