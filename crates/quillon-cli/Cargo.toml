[package]
name = "quillon-cli"
description = "Quillon command-line interface: validate and render video documents"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quillon"
path = "src/main.rs"

[dependencies]
quillon-core = { workspace = true }
quillon-render = { workspace = true }
quillon-media = { workspace = true }
rmcp = { workspace = true }
base64 = { workspace = true }
ffmpeg-sidecar = { workspace = true }
quillon-audio = { workspace = true }
rsubs-lib = { workspace = true }
quillon-cache = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
quillon-audio = { workspace = true }
serde_json = { workspace = true }
# The E2E agent-loop test drives the server as a real MCP client.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
